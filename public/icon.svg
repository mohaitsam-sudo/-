<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="busBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" />
  
  <!-- Bus Silhouette Front-Angle -->
  <g transform="translate(60, 110)">
    <!-- Bus main body -->
    <rect x="20" y="40" width="350" height="190" rx="24" fill="url(#busBody)" stroke="#38bdf8" stroke-width="4" />
    <!-- Windshield -->
    <path d="M 40 60 L 150 60 L 150 140 L 40 140 Z" fill="#38bdf8" opacity="0.8" rx="6" />
    <!-- Side windows -->
    <rect x="170" y="60" width="50" height="70" rx="6" fill="#38bdf8" opacity="0.6" />
    <rect x="230" y="60" width="50" height="70" rx="6" fill="#38bdf8" opacity="0.6" />
    <rect x="290" y="60" width="60" height="70" rx="6" fill="#38bdf8" opacity="0.6" />
    <!-- Headlights -->
    <circle cx="45" cy="180" r="16" fill="#fef08a" />
    <circle cx="45" cy="180" r="22" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.5" />
    <circle cx="95" cy="180" r="12" fill="#38bdf8" />
    <!-- Bumper & Grill -->
    <rect x="120" y="170" width="220" height="20" rx="6" fill="#334155" />
    <!-- Wheels -->
    <circle cx="90" cy="240" r="38" fill="#0f172a" stroke="#64748b" stroke-width="8" />
    <circle cx="90" cy="240" r="16" fill="#94a3b8" />
    <circle cx="300" cy="240" r="38" fill="#0f172a" stroke="#64748b" stroke-width="8" />
    <circle cx="300" cy="240" r="16" fill="#94a3b8" />
  </g>

  <!-- Title Text -->
  <text x="256" y="405" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">MOHAMED HAITHAM</text>
  <text x="256" y="445" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="800" font-size="22" fill="#38bdf8" letter-spacing="2">BUS SIMULATOR 3D</text>
  <text x="256" y="480" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="700" font-size="18" fill="#f59e0b">محاكي الأوتوبيسات الواقعي</text>
</svg>
